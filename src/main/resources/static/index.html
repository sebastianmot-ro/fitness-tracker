<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <header class="app-header">
        <h1>Fitness Tracker</h1>
        <p class="sub">Log activities, track progress, feel great.</p>
    </header>

    <main class="main-grid">
        <aside class="panel panel-form">
            <h2>Add Activity</h2>
            <form id="activityForm" novalidate>
                <div class="form-row">
                    <label for="type">Type</label>
                    <select id="type" required>
                        <option value="RUN">Run</option>
                        <option value="BIKE">Bike</option>
                        <option value="SWIM">Swim</option>
                    </select>
                </div>

                <div class="form-row">
                    <label for="startTime">Start Time</label>
                    <input type="datetime-local" id="startTime" required>
                </div>

                <div class="form-row twoup">
                    <div>
                        <label for="durationSeconds">Duration (seconds)</label>
                        <input type="number" id="durationSeconds" min="0" required>
                    </div>
                    <div>
                        <label for="distanceMeters">Distance (meters)</label>
                        <input type="number" id="distanceMeters" min="0" required>
                    </div>
                </div>

                <div class="form-row twoup">
                    <div>
                        <label for="calories">Calories</label>
                        <input type="number" id="calories" min="0" required>
                    </div>
                    <div>
                        <label for="notes">Notes</label>
                        <input type="text" id="notes" placeholder="Optional notes...">
                    </div>
                </div>

                <div class="form-row">
                    <button type="submit" class="btn-primary">Add Activity</button>
                </div>
            </form>
        </aside>

        <section class="panel panel-list">
            <div class="list-header">
                <h2>Activities</h2>
                <div class="controls">
                    <label for="filterType">Filter:</label>
                    <select id="filterType">
                        <option value="ALL">All</option>
                        <option value="RUN">Run</option>
                        <option value="BIKE">Bike</option>
                        <option value="SWIM">Swim</option>
                    </select>
                </div>
            </div>

            <div id="activitiesContainer" class="activities-container">
                <div id="loading" class="loading">Loading activities…</div>
                <ul id="activitiesList" class="activities-list"></ul>
                <div id="emptyState" class="empty">No activities yet. Add your first activity!</div>
            </div>
        </section>
    </main>

    <div id="toast" class="toast" aria-live="polite"></div>
</div>

<script src="app.js"></script>
</body>
</html>
